<div class="fixed inset-0 z-[-1] overflow-hidden pointer-events-none bg-geek-black">

  <!-- Base grid -->
  <div class="absolute inset-0 bg-grid-pattern opacity-[0.03]"></div>

  <!-- Mouse radial glow -->
  <div
    class="absolute inset-0 transition-opacity duration-500"
    [style.background]="'radial-gradient(600px circle at ' + mouseX() + 'px ' + mouseY() + 'px, rgba(0, 255, 65, 0.08), transparent 40%)'"
  ></div>

  <!-- Mouse grid reveal -->
  <div
    class="absolute inset-0 bg-grid-pattern opacity-20"
    [style.mask-image]="'radial-gradient(250px circle at ' + mouseX() + 'px ' + mouseY() + 'px, black, transparent)'"
    [style.-webkit-mask-image]="'radial-gradient(250px circle at ' + mouseX() + 'px ' + mouseY() + 'px, black, transparent)'"
  ></div>

  <!-- Subtle vignette -->
  <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,transparent_0%,rgba(0,0,0,0.4)_100%)]"></div>
</div>
